<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful - Bhragesh Store</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        .success-container {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .success-card {
            width: 100%;
            max-width: 550px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 45px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #22c55e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        .success-card h1 {
            margin-bottom: 10px;
            color: #222;
        }

        .success-card p {
            color: #666;
            margin-bottom: 25px;
        }

        .order-details {
            background: #f7f7f7;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .order-details div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .order-details div:last-child {
            margin-bottom: 0;
        }

        .order-details strong {
            color: #222;
        }

        .continue-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #ff8a00;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .continue-btn:hover {
            background: #e87900;
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <h1>Payment Successful!</h1>

            <p>
                Thank you for your order.
                Your payment has been verified successfully.
            </p>

            <div class="order-details">

                <div>
                    <span>Order ID</span>
                    <strong id="order-id">-</strong>
                </div>

                <div>
                    <span>Payment ID</span>
                    <strong id="payment-id">-</strong>
                </div>

                <div>
                    <span>Amount</span>
                    <strong id="amount">-</strong>
                </div>

            </div>

            <a
                href="/"
                class="continue-btn"
            >
                Continue Shopping
            </a>

        </div>

    </div>

    <script src="/js/success.js"></script>

</body>
</html>
