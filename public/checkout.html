<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Bhragesh Store</title>

    <link rel="stylesheet" href="/css/style.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container navbar">

            <a href="/" class="logo">
                🔧 Bhragesh Store
            </a>

            <nav>
                <a href="/">Home</a>
                <a href="/#products">Products</a>

                <a href="/cart.html" class="cart-link">
                    🛒 Cart
                    <span id="cart-count">0</span>
                </a>
            </nav>

        </div>

    </header>


    <!-- Checkout -->
    <main class="checkout-page">

        <div class="container">

            <h1>Checkout</h1>

            <p class="checkout-subtitle">
                Enter your details to place your order.
            </p>


            <div class="checkout-layout">


                <!-- Customer Details -->

                <section class="checkout-form">

                    <h2>Customer Details</h2>

                    <form id="checkout-form">

                        <div class="form-group">

                            <label for="name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Mobile Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter 10 digit mobile number"
                                pattern="[0-9]{10}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="address">
                                Delivery Address
                            </label>

                            <textarea
                                id="address"
                                name="address"
                                rows="4"
                                placeholder="Enter your complete address"
                                required
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="checkout-btn"
                        >
                            Continue to Payment
                        </button>

                    </form>

                </section>


                <!-- Order Summary -->

                <section class="order-summary">

                    <h2>Order Summary</h2>

                    <div id="checkout-items">
                        <!-- Cart products will appear here -->
                    </div>

                    <hr>

                    <div class="summary-row">

                        <span>Subtotal</span>

                        <strong id="checkout-subtotal">
                            ₹0
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>Shipping</span>

                        <strong>Free</strong>

                    </div>


                    <div class="summary-total">

                        <span>Total</span>

                        <strong id="checkout-total">
                            ₹0
                        </strong>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <footer>

        <div class="container">

            <p>
                © 2026 Bhragesh Store. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="/js/checkout.js"></script>

</body>

</html>
